name: Python routing tests

on:
  push:
    branches:
      - feature/qt-route-selector
  pull_request:
    paths:
      - "qt_route_selector/**"
      - "requirements.txt"
      - ".github/workflows/python-routing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install routing test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas networkx geopandas shapely pyproj pyogrio pyarrow

      - name: Compile Python files
        run: python -m compileall -q qt_route_selector

      - name: Run unit tests
        run: python -m unittest discover -s qt_route_selector/tests -v
