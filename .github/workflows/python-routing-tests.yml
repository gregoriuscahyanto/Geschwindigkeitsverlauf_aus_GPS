name: Python routing tests

on:
  push:
    branches:
      - feature/qt-route-selector
  pull_request:
    paths:
      - "qt_route_selector/**"
      - "requirements.txt"
      - ".github/workflows/python-routing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0

      - name: Install routing test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyqtgraph numpy pandas networkx geopandas shapely pyproj pyogrio pyarrow osmium rasterio

      - name: Compile Python files
        run: python -m compileall -q qt_route_selector

      - name: Run unit tests
        run: python -m unittest discover -s qt_route_selector/tests -v

      - name: Load unified Qt application offscreen
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          app_dir = Path("qt_route_selector").resolve()
          sys.path.insert(0, str(app_dir))

          from PySide6.QtCore import Qt
          from PySide6.QtQuickWidgets import QQuickWidget
          from PySide6.QtWidgets import (
              QApplication,
              QGroupBox,
              QPushButton,
              QScrollArea,
              QSplitter,
          )
          from complete_app import CompleteApplicationWindow

          app = QApplication([])
          window = CompleteApplicationWindow(force_offline=True)
          if window.tabs.count() != 3:
              raise SystemExit("Unified application does not contain three tabs")
          if "Route" not in window.tabs.tabText(0):
              raise SystemExit("Routing tab was not created")
          if "Geschwindigkeitsverlauf" not in window.tabs.tabText(1):
              raise SystemExit("Simulation tab was not created")
          if "Datenabdeckung" not in window.tabs.tabText(2):
              raise SystemExit("Data coverage tab was not created")

          if not hasattr(window, "simulation_loading_bar"):
              raise SystemExit("Simulation tab has no visible lazy-loading progress indicator")
          if not hasattr(window, "coverage_loading_bar"):
              raise SystemExit("Coverage tab has no visible lazy-loading progress indicator")
          if hasattr(window, "dataset_combo"):
              raise SystemExit("Manual dataset selector still exists; region selection must be automatic")
          if not hasattr(window, "detected_region_label"):
              raise SystemExit("Automatic detected-region indicator is missing")
          if hasattr(window, "dataset_inventory_label"):
              raise SystemExit("Dataset inventory still clutters routing tab 1")

          if window.speed_profile is not None:
              raise SystemExit("Heavy simulation UI was created during startup")
          if window.coverage_tab is not None:
              raise SystemExit("Coverage map was created during startup")
          if not window._simulation_load_pending:
              raise SystemExit("Simulation route load is not deferred at startup")

          window.tabs.setCurrentIndex(1)
          window._ensure_simulation_created()
          app.processEvents()
          simulation = window.speed_profile
          if simulation is None:
              raise SystemExit("Lazy simulation UI was not created on demand")
          if not hasattr(simulation, "set_dem_path"):
              raise SystemExit("Programmatic DEM activation is missing")
          if simulation._result is not None:
              raise SystemExit("Simulation was unexpectedly calculated without a route")
          if simulation.axis_combo.count() != 2:
              raise SystemExit("Time/distance axis selector is missing")

          expected_groups = {"Kurven", "Ampeln", "Überholen", "Rauschen", "Fahrzeug"}
          groups = {
              group.title(): group
              for group in simulation.findChildren(QGroupBox)
              if group.title() in expected_groups
          }
          if set(groups) != expected_groups:
              raise SystemExit("One or more flattened setting groups are missing")
          for title, group in groups.items():
              if group.isHidden():
                  raise SystemExit(f"Setting group is hidden: {title}")
              layout = group.layout()
              if layout is None or layout.count() == 0:
                  raise SystemExit(f"Setting group is empty: {title}")

          scroll_areas = simulation.findChildren(QScrollArea)
          if not scroll_areas:
              raise SystemExit("Settings scroll area is missing")
          if all(
              area.verticalScrollBarPolicy() == Qt.ScrollBarPolicy.ScrollBarAlwaysOff
              for area in scroll_areas
          ):
              raise SystemExit("Vertical settings scrolling is disabled")

          for attribute in (
              "resistance_plot",
              "load_collective_plot",
              "power_summary_label",
              "right_analysis_panel",
              "reset_views_button",
              "comparison_group",
              "collective_normalized_check",
              "collective_positive_check",
              "collective_log_check",
              "elevation_smoothing_spin",
              "preview_controller",
              "plot_stack_splitter",
              "right_vertical_splitter",
              "combined_plot",
              "combined_container",
              "plot_mode_combo",
              "signals_button",
              "signal_actions",
              "sidebar_toggle_button",
              "energy_header_label",
          ):
              if not hasattr(simulation, attribute) or getattr(simulation, attribute) is None:
                  raise SystemExit(f"Simulation UX is missing: {attribute}")

          if len(simulation.preview_controller.plots) != 6:
              raise SystemExit("Technical parameter mini-plots are incomplete")
          forbidden_dem_buttons = {"DEM / GeoTIFF wählen", "DEM entfernen"}
          if any(
              button.text() in forbidden_dem_buttons and button.isVisible()
              for button in simulation.findChildren(QPushButton)
          ):
              raise SystemExit("Manual DEM buttons are still visible in the simulation tab")

          if simulation.plot_mode_combo.currentData() != "combined":
              raise SystemExit("Combined analysis plot is not the default mode")
          if simulation.combined_container.isHidden():
              raise SystemExit("Combined analysis plot is explicitly hidden by default")
          if not simulation.plot_stack_splitter.isHidden():
              raise SystemExit("Legacy four-plot stack is still visible in combined mode")
          if set(simulation._combined_views) != {"speed", "acceleration", "elevation", "power"}:
              raise SystemExit("Combined analysis plot does not expose all four y-axis groups")
          if sum(action.isChecked() for action in simulation.signal_actions.values()) < 4:
              raise SystemExit("Combined analysis plot has too few useful default signals")
          plot_root = simulation.centralWidget().widget(1)
          if simulation.energy_header_label.parentWidget() is not plot_root:
              raise SystemExit("Energy balance was not moved into the compact top summary area")
          if not simulation.sidebar_toggle_button.isChecked():
              raise SystemExit("Modern parameter sidebar toggle does not reflect the visible pane")

          simulation.sidebar_toggle_button.setChecked(False)
          app.processEvents()
          if not simulation._parameter_pane.isHidden():
              raise SystemExit("Modern parameter sidebar cannot be collapsed")
          simulation.sidebar_toggle_button.setChecked(True)
          app.processEvents()
          if simulation._parameter_pane.isHidden():
              raise SystemExit("Modern parameter sidebar cannot be reopened")

          simulation.plot_mode_combo.setCurrentIndex(1)
          app.processEvents()
          if simulation.plot_stack_splitter.isHidden() or not simulation.combined_container.isHidden():
              raise SystemExit("Optional four-plot fallback mode cannot be activated")
          simulation.plot_mode_combo.setCurrentIndex(0)
          app.processEvents()

          simulation.compare_name_edit.setText("Baseline")
          simulation._save_comparison_config()
          if len(simulation._comparison_configs) != 1:
              raise SystemExit("Configuration snapshot could not be stored")
          if "Baseline" not in simulation._fixed_legends["speed"].text():
              raise SystemExit("Fixed comparison legend does not show stored configuration")
          simulation._clear_comparisons()

          for key in (
              "vehicle_mass_kg",
              "trailer_mass_kg",
              "rolling_resistance_coeff",
              "air_drag_coefficient",
              "frontal_area_m2",
              "air_density_kg_m3",
              "trailer_rolling_resistance_coeff",
              "trailer_drag_area_m2",
              "grade_smoothing_m",
          ):
              if key not in simulation._control_widgets:
                  raise SystemExit(f"Resistance-power input is missing: {key}")

          map_splitter = simulation.plot_map_splitter
          if not isinstance(map_splitter, QSplitter):
              raise SystemExit("Map/plot splitter is missing")
          if map_splitter.orientation() != Qt.Orientation.Horizontal:
              raise SystemExit("Geographic map is not positioned beside the plots")
          if map_splitter.count() != 2:
              raise SystemExit("Map/plot splitter does not contain exactly two panels")

          plot_stack = simulation.plot_stack_splitter
          if plot_stack.orientation() != Qt.Orientation.Vertical or plot_stack.count() != 4:
              raise SystemExit("Four analysis plots are not retained as an optional fallback")
          right_stack = simulation.right_vertical_splitter
          if right_stack.orientation() != Qt.Orientation.Vertical or right_stack.count() != 2:
              raise SystemExit("Map and load collective are not in a resizable right-side splitter")
          if right_stack.parentWidget() is not simulation.right_analysis_panel:
              raise SystemExit("Right-side analysis splitter is outside its panel")
          if simulation._parameter_pane is None or simulation._parameter_pane.maximumWidth() > 420:
              raise SystemExit("Parameter pane is still too wide for the analysis layout")

          if simulation.dem_status_label is None:
              raise SystemExit("Automatic DEM status is missing")
          if simulation.map_widget.status() == QQuickWidget.Status.Error:
              errors = "\n".join(error.toString() for error in simulation.map_widget.errors())
              raise SystemExit(f"Simulation map QML failed to load:\n{errors}")

          window.tabs.setCurrentIndex(2)
          window._ensure_coverage_created()
          coverage = window.coverage_tab
          if coverage is None:
              raise SystemExit("Lazy data coverage tab was not created on demand")
          if coverage.map_widget.status() == QQuickWidget.Status.Error:
              errors = "\n".join(error.toString() for error in coverage.map_widget.errors())
              raise SystemExit(f"Coverage map QML failed to load:\n{errors}")
          inventory = coverage.inventory_label.text()
          for expected in (
              "Österreich (gesamt)",
              "Baden-Württemberg",
              "Bayern",
              "Hessen",
              "Schweiz",
              "DACH",
          ):
              if expected not in inventory:
                  raise SystemExit(f"Coverage status entry is missing: {expected}")

          print("Unified Qt application uses a combined multi-axis plot, modern sidebar, compact energy header and lazy loading indicators")
          window.close()
          PY