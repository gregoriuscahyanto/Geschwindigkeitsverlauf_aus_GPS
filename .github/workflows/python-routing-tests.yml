name: Python routing tests

on:
  push:
    branches:
      - feature/qt-route-selector
  pull_request:
    paths:
      - "qt_route_selector/**"
      - "requirements.txt"
      - ".github/workflows/python-routing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0

      - name: Install routing test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyqtgraph numpy pandas networkx geopandas shapely pyproj pyogrio pyarrow osmium rasterio

      - name: Compile Python files
        run: python -m compileall -q qt_route_selector

      - name: Run unit tests
        run: python -m unittest discover -s qt_route_selector/tests -v

      - name: Load unified Qt application offscreen
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          app_dir = Path("qt_route_selector").resolve()
          sys.path.insert(0, str(app_dir))

          from PySide6.QtCore import Qt
          from PySide6.QtQuickWidgets import QQuickWidget
          from PySide6.QtWidgets import (
              QApplication,
              QGroupBox,
              QScrollArea,
              QSplitter,
          )
          from complete_app import CompleteApplicationWindow

          app = QApplication([])
          window = CompleteApplicationWindow(force_offline=True)
          if window.tabs.count() != 3:
              raise SystemExit("Unified application does not contain three tabs")
          if "Route" not in window.tabs.tabText(0):
              raise SystemExit("Routing tab was not created")
          if "Geschwindigkeitsverlauf" not in window.tabs.tabText(1):
              raise SystemExit("Simulation tab was not created")
          if "Datenabdeckung" not in window.tabs.tabText(2):
              raise SystemExit("Data coverage tab was not created")

          if hasattr(window, "dataset_combo"):
              raise SystemExit("Manual dataset selector still exists; region selection must be automatic")
          if not hasattr(window, "detected_region_label"):
              raise SystemExit("Automatic detected-region indicator is missing")
          if hasattr(window, "dataset_inventory_label"):
              raise SystemExit("Dataset inventory still clutters routing tab 1")

          if window.speed_profile is not None:
              raise SystemExit("Heavy simulation UI was created during startup")
          if window.coverage_tab is not None:
              raise SystemExit("Coverage map was created during startup")
          if not window._simulation_load_pending:
              raise SystemExit("Simulation route load is not deferred at startup")

          # Explicitly open tab 2 and construct the heavy UI only now.
          window.tabs.setCurrentIndex(1)
          window._ensure_simulation_created()
          simulation = window.speed_profile
          if simulation is None:
              raise SystemExit("Lazy simulation UI was not created on demand")
          if not hasattr(simulation, "set_dem_path"):
              raise SystemExit("Programmatic DEM activation is missing")
          if simulation._result is not None:
              raise SystemExit("Simulation was unexpectedly calculated without a route")
          if simulation.axis_combo.count() != 2:
              raise SystemExit("Time/distance axis selector is missing")

          expected_groups = {"Kurven", "Ampeln", "Überholen", "Rauschen", "Fahrzeug"}
          groups = {
              group.title(): group
              for group in simulation.findChildren(QGroupBox)
              if group.title() in expected_groups
          }
          if set(groups) != expected_groups:
              raise SystemExit("One or more flattened setting groups are missing")
          for title, group in groups.items():
              if group.isHidden():
                  raise SystemExit(f"Setting group is hidden: {title}")
              layout = group.layout()
              if layout is None or layout.count() == 0:
                  raise SystemExit(f"Setting group is empty: {title}")
              child = layout.itemAt(0).widget()
              if child is None or child.isHidden():
                  raise SystemExit(f"Setting group content is hidden: {title}")

          scroll_areas = simulation.findChildren(QScrollArea)
          if not scroll_areas:
              raise SystemExit("Settings scroll area is missing")
          if all(
              area.verticalScrollBarPolicy() == Qt.ScrollBarPolicy.ScrollBarAlwaysOff
              for area in scroll_areas
          ):
              raise SystemExit("Vertical settings scrolling is disabled")

          for attribute in (
              "resistance_plot",
              "load_collective_plot",
              "power_summary_label",
              "right_analysis_panel",
          ):
              if not hasattr(simulation, attribute) or getattr(simulation, attribute) is None:
                  raise SystemExit(f"Resistance-power UI is missing: {attribute}")
          for key in (
              "vehicle_mass_kg",
              "trailer_mass_kg",
              "rolling_resistance_coeff",
              "air_drag_coefficient",
              "frontal_area_m2",
              "air_density_kg_m3",
              "trailer_rolling_resistance_coeff",
              "trailer_drag_area_m2",
              "grade_smoothing_m",
          ):
              if key not in simulation._control_widgets:
                  raise SystemExit(f"Resistance-power input is missing: {key}")

          map_splitter = simulation.plot_map_splitter
          if not isinstance(map_splitter, QSplitter):
              raise SystemExit("Map/plot splitter is missing")
          if map_splitter.orientation() != Qt.Orientation.Horizontal:
              raise SystemExit("Geographic map is not positioned beside the plots")
          if map_splitter.count() != 2:
              raise SystemExit("Map/plot splitter does not contain exactly two panels")
          if simulation.map_widget.parentWidget() is not simulation.right_analysis_panel:
              raise SystemExit("Geographic map is not in the right analysis panel")
          if simulation.load_collective_plot.parentWidget() is not simulation.right_analysis_panel:
              raise SystemExit("Load collective is not positioned below the geographic map")
          if simulation.resistance_plot.parentWidget() is not simulation.speed_plot.parentWidget():
              raise SystemExit("Resistance power is not the fourth stacked synchronized plot")

          if simulation.dem_status_label is None:
              raise SystemExit("DEM controls are missing")
          if simulation.map_widget.status() == QQuickWidget.Status.Error:
              errors = "\n".join(error.toString() for error in simulation.map_widget.errors())
              raise SystemExit(f"Simulation map QML failed to load:\n{errors}")

          # Tab 3 is also lazy. It reads only local file status and must not
          # initiate geodata downloads merely to display the overview.
          window.tabs.setCurrentIndex(2)
          window._ensure_coverage_created()
          coverage = window.coverage_tab
          if coverage is None:
              raise SystemExit("Lazy data coverage tab was not created on demand")
          if coverage.map_widget.status() == QQuickWidget.Status.Error:
              errors = "\n".join(error.toString() for error in coverage.map_widget.errors())
              raise SystemExit(f"Coverage map QML failed to load:\n{errors}")
          inventory = coverage.inventory_label.text()
          for expected in (
              "Österreich (gesamt)",
              "Baden-Württemberg",
              "Bayern",
              "Hessen",
              "Schweiz",
              "DACH",
          ):
              if expected not in inventory:
                  raise SystemExit(f"Coverage status entry is missing: {expected}")

          print("Unified Qt application uses automatic regions, four synchronized plots, load collective and lazy maps")
          window.close()
          PY