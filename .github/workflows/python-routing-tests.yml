name: Python routing tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "qt_route_selector/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/python-routing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile package
        run: python -m compileall -q qt_route_selector

      - name: Run tests
        run: python -m unittest discover -s qt_route_selector/tests -v

  offline-windows-setup:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Build offline wheelhouse
        shell: powershell
        run: .\scripts\build_offline_dependencies.ps1

      - name: Install from wheelhouse
        shell: powershell
        run: .\scripts\setup_windows.ps1

      - name: Verify local environment
        shell: powershell
        run: .\.venv\Scripts\python.exe -c "import PySide6, pyqtgraph, numpy, scipy, pandas, geopandas, rasterio; print('Offline Windows environment OK')"
