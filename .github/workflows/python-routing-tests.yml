name: Python routing tests

on:
  push:
    branches:
      - feature/qt-route-selector
  pull_request:
    paths:
      - "qt_route_selector/**"
      - "requirements.txt"
      - ".github/workflows/python-routing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install routing test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 numpy pandas networkx geopandas shapely pyproj pyogrio pyarrow

      - name: Compile Python files
        run: python -m compileall -q qt_route_selector

      - name: Run unit tests
        run: python -m unittest discover -s qt_route_selector/tests -v

      - name: Load QML application offscreen
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          app_dir = Path("qt_route_selector").resolve()
          sys.path.insert(0, str(app_dir))

          from PySide6.QtQml import QQmlApplicationEngine, qmlRegisterType
          from PySide6.QtWidgets import QApplication
          from main import RouteSelector
          from offline_map import OfflineMapItem

          app = QApplication([])
          qmlRegisterType(OfflineMapItem, "OfflineMap", 1, 0, "OfflineMapItem")
          engine = QQmlApplicationEngine()
          selector = RouteSelector()
          engine.rootContext().setContextProperty("routeSelector", selector)
          engine.load(str(app_dir / "main.qml"))
          if not engine.rootObjects():
              raise SystemExit("QML application could not be created")
          print("QML application loaded successfully")
          PY
