name: Python routing tests

on:
  push:
    branches:
      - feature/qt-route-selector
  pull_request:
    paths:
      - "qt_route_selector/**"
      - "requirements.txt"
      - ".github/workflows/python-routing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install routing test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyqtgraph numpy pandas networkx geopandas shapely pyproj pyogrio pyarrow osmium

      - name: Compile Python files
        run: python -m compileall -q qt_route_selector

      - name: Run unit tests
        run: python -m unittest discover -s qt_route_selector/tests -v

      - name: Load unified Qt application offscreen
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          app_dir = Path("qt_route_selector").resolve()
          sys.path.insert(0, str(app_dir))

          from PySide6.QtQuickWidgets import QQuickWidget
          from PySide6.QtWidgets import QApplication, QTabWidget
          from complete_app import CompleteApplicationWindow

          app = QApplication([])
          window = CompleteApplicationWindow(force_offline=True)
          if window.tabs.count() != 2:
              raise SystemExit("Unified application does not contain two tabs")
          if "Route" not in window.tabs.tabText(0):
              raise SystemExit("Routing tab was not created")
          if "Geschwindigkeitsverlauf" not in window.tabs.tabText(1):
              raise SystemExit("Simulation tab was not created")

          simulation = window.speed_profile
          if simulation.axis_combo.count() != 2:
              raise SystemExit("Time/distance axis selector is missing")
          if simulation.findChildren(QTabWidget):
              raise SystemExit("Simulation settings still contain nested tabs")
          if simulation.map_widget.status() == QQuickWidget.Status.Error:
              errors = "\n".join(error.toString() for error in simulation.map_widget.errors())
              raise SystemExit(f"Simulation map QML failed to load:\n{errors}")

          print("Unified Qt application loaded successfully")
          window.close()
          PY
